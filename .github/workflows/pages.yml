# Builds the homepage into one offline file and publishes it with GitHub Pages.
# Enable Pages once: Settings -> Pages -> Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bundle the homepage (single offline file)
        run: |
          mkdir -p _site
          python3 site/tools/gen_tree.py
          python3 skills/playme/scripts/bundle.py site/index.html -o _site/index.html --offline
          cp _site/index.html _site/PLAYME.html
          cp -r assets _site/assets
          mkdir -p _site/examples/starter _site/examples/second-chance
          cp examples/starter/PLAYME.html _site/examples/starter/PLAYME.html
          cp examples/second-chance/PLAYME.html _site/examples/second-chance/PLAYME.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
